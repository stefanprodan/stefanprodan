<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux Operator · ResourceSets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:      #f5f5f5;
      --paper-2:    #ffffff;
      --ink:        #2d3142;
      --ink-rgb:    45,49,66;
      --muted:      #4f5d75;
      --muted-rgb:  79,93,117;
      --soft:       #7a8399;
      --accent:     #eb6c36;
      --accent-rgb: 235,108,54;
      --link:       #2e5aa8;
      --color-paper:  var(--paper);
      --color-ink:    var(--ink);
      --color-muted:  var(--muted);
      --color-accent: var(--accent);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-title:    'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    :root:has(#theme:checked),
    :root:has(#dark:target) {
      --paper:      #2d3142;
      --paper-2:    #393e53;
      --ink:        #f5f5f5;
      --ink-rgb:    245,245,245;
      --muted:      #bfc0c0;
      --muted-rgb:  191,192,192;
      --soft:       #8e98ac;
      --accent:     #f08a59;
      --accent-rgb: 240,138,89;
      --link:       #6a95d8;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 1rem;
    }

    .frame { width: 100%; max-width: 1080px; position: relative; }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .frame:hover .theme-toggle, .theme-toggle:focus-within { opacity: 1; }
    @media print { .theme-toggle { display: none; } }
    .theme-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-toggle .track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      border: 1px solid rgba(var(--ink-rgb), 0.30);
      background: rgba(var(--ink-rgb), 0.05);
      position: relative;
      transition: background 120ms ease;
    }
    .theme-toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-muted);
      transition: transform 120ms ease;
    }
    .theme-toggle input:checked + .track { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); }
    .theme-toggle input:checked + .track::after { transform: translateX(12px); background: var(--accent); }
    .theme-toggle input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    .eyebrow-url { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--link); }
    .eyebrow-url::before { content: "/"; color: var(--soft); margin: 0 0.6em 0 0.4em; }

    h1 {
      font-family: var(--font-title);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-family: var(--font-title);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    svg { width: 100%; min-width: 856px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <span id="dark" hidden></span>
    <label class="theme-toggle"><input type="checkbox" id="theme"><span class="track"></span><span>Dark</span></label>
    <p class="eyebrow">Architecture<span class="eyebrow-url">fluxoperator.dev</span></p>
    <h1>Self-service environments with ResourceSets</h1>
    <p class="subtitle">From external inputs to tenant environments</p>

    <svg viewBox="16 56 856 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Self-service environments with ResourceSets" aria-describedby="flux-operator-resourcesets-desc">
      <desc id="flux-operator-resourcesets-desc">Architecture diagram of the ResourceSet reconciliation flow. ResourceSetInputProviders list pull requests from a Git provider and artifact tags from a container registry and export them as inputs. A ResourceSet renders its templates once per input, and the Flux Operator applies the generated objects with server-side apply and prunes the ones whose inputs disappeared. The generated sources, Kustomizations and HelmReleases are reconciled by the Flux controllers, which apply the tenant environments.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
      </defs>

      <rect x="0" y="0" width="888" height="544" fill="var(--paper)"/>

      <!-- ===== Zones (painted first) ===== -->
      <!-- Zone: Kubernetes cluster -->
      <rect x="224" y="72" width="632" height="392" rx="8"
            fill="rgba(var(--ink-rgb),0.02)" stroke="rgba(var(--ink-rgb),0.10)" stroke-width="0.8"/>
      <rect x="244" y="76" width="104" height="12" rx="2" fill="var(--paper)"/>
      <text x="296" y="85" fill="rgba(var(--ink-rgb),0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">KUBERNETES CLUSTER</text>

      <!-- ===== Arrows (behind boxes) ===== -->
      <!-- A1 Git provider -> Input providers (HTTP/S) -->
      <line x1="184" y1="136" x2="240" y2="136" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A2 Container registry -> Input providers (HTTP/S) -->
      <line x1="184" y1="244" x2="240" y2="244" stroke="var(--link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- A3 Input providers -> ResourceSet -->
      <line x1="392" y1="136" x2="464" y2="136" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A4 ResourceSet -> Flux Operator -->
      <line x1="616" y1="136" x2="688" y2="136" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A5 Flux Operator -> Generated objects (exit bottom at x=704, elbow left, enter top at x=540) -->
      <path d="M 704,168 V 200 Q 704,208 696,208 H 548 Q 540,208 540,216 V 248"
            fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A6 Generated objects -> Flux controllers -->
      <line x1="616" y1="280" x2="688" y2="280" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A7 Flux controllers -> Tenant environment -->
      <line x1="764" y1="312" x2="764" y2="384" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (masked, 8px above the stroke or beside vertical segments) ===== -->
      <rect x="194" y="116" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="212" y="125" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLL</text>

      <rect x="194" y="224" width="36" height="12" rx="2" fill="var(--paper)"/>
      <text x="212" y="233" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCAN</text>

      <rect x="406" y="116" width="44" height="12" rx="2" fill="var(--paper)"/>

      <rect x="620" y="116" width="64" height="12" rx="2" fill="var(--paper)"/>
      <text x="652" y="125" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECONCILE</text>

      <rect x="582" y="188" width="80" height="12" rx="2" fill="var(--paper)"/>
      <text x="622" y="197" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY · PRUNE</text>

      <rect x="620" y="260" width="64" height="12" rx="2" fill="var(--paper)"/>
      <text x="652" y="269" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECONCILE</text>

      <rect x="772" y="336" width="40" height="12" rx="2" fill="var(--paper)"/>
      <text x="776" y="345" fill="var(--muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">APPLY</text>

      <rect x="32" y="104" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="32" y="104" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.03)" stroke="rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
      <rect x="40" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.22)" stroke-width="0.8"/>
      <text x="54" y="121" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>

      <rect x="32" y="212" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="32" y="212" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.03)" stroke="rgba(var(--ink-rgb),0.30)" stroke-width="1"/>
      <rect x="40" y="220" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.22)" stroke-width="0.8"/>
      <text x="54" y="229" fill="var(--soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OCI</text>
      <text x="108" y="248" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container registry</text>
      <text x="108" y="264" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">image · chart tags</text>

      <!-- N3: Input providers (custom resources) with provider type rows -->
      <rect x="240" y="104" width="152" height="228" rx="6" fill="var(--paper)"/>
      <rect x="240" y="104" width="152" height="228" rx="6" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>
      <rect x="248" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
      <text x="262" y="121" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CR</text>
      <text x="316" y="140" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Input providers</text>
      <text x="316" y="156" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ResourceSetInputProvider</text>
      <line x1="240" y1="164" x2="392" y2="164" stroke="rgba(var(--muted-rgb),0.30)" stroke-width="0.8"/>
      <g fill="var(--ink)" font-size="8" font-family="'Geist Mono', monospace" xml:space="preserve">
        <text x="252" y="188">GitHubPullRequest</text>
        <text x="252" y="216">GitLabMergeRequest</text>
        <text x="252" y="244">OCIArtifactTag</text>
        <text x="252" y="272">ExternalArtifact</text>
        <text x="252" y="300">Static · ExternalService</text>
      </g>

      <!-- N4: ResourceSet (custom resource) -->
      <rect x="464" y="104" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="464" y="104" width="152" height="64" rx="6" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>
      <rect x="472" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
      <text x="486" y="121" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CR</text>
      <text x="540" y="140" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ResourceSet</text>
      <text x="540" y="156" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&lt;&lt; inputs.x &gt;&gt; templates</text>

      <!-- N5: Flux Operator (focal) -->
      <rect x="688" y="104" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="688" y="104" width="152" height="64" rx="6" fill="rgba(var(--accent-rgb),0.08)" stroke="var(--accent)" stroke-width="1"/>
      <rect x="696" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--accent-rgb),0.50)" stroke-width="0.8"/>

      <text x="764" y="140" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flux Operator</text>
      <text x="764" y="156" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Go templates · sprig</text>

      <!-- N6: Generated objects (custom resources) -->
      <rect x="464" y="248" width="152" height="180" rx="6" fill="var(--paper)"/>
      <rect x="464" y="248" width="152" height="180" rx="6" fill="rgba(var(--ink-rgb),0.08)" stroke="rgba(var(--ink-rgb),0.25)" stroke-width="1"/>
      <rect x="472" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--muted-rgb),0.50)" stroke-width="0.8"/>
      <text x="486" y="265" fill="var(--muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CR</text>
      <text x="540" y="284" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generated objects</text>
      <text x="540" y="300" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one set per input</text>
      <line x1="464" y1="308" x2="616" y2="308" stroke="rgba(var(--muted-rgb),0.30)" stroke-width="0.8"/>
      <g fill="var(--ink)" font-size="9" font-family="'Geist Mono', monospace" xml:space="preserve">
        <text x="476" y="328">Namespace · RBAC</text>
        <text x="476" y="348">GitRepository</text>
        <text x="476" y="368">OCIRepository</text>
        <text x="476" y="388">Kustomization</text>
        <text x="476" y="408">HelmRelease · Job</text>
      </g>

      <!-- N7: Flux controllers -->
      <rect x="688" y="248" width="152" height="64" rx="6" fill="var(--paper)"/>
      <rect x="688" y="248" width="152" height="64" rx="6" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>
      <rect x="696" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(var(--ink-rgb),0.40)" stroke-width="0.8"/>
      <text x="710" y="265" fill="var(--ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>

      <text x="764" y="300" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitOps Toolkit</text>

      <text x="764" y="420" fill="var(--ink)" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenant environment</text>
      <text x="764" y="436" fill="var(--muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">preview · staging · prod</text>

      <!-- ===== Legend strip ===== -->

      <rect x="136" y="516" width="14" height="10" rx="2" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="1"/>

      <text x="436" y="524" fill="var(--muted)" font-size="8.5" font-family="'Geist', sans-serif">External</text>

      <line x1="520" y1="522" x2="548" y2="522" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

  </div>
</body>
</html>
