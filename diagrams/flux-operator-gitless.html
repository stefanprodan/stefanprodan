<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:      #f5f5f5;
      --paper-2:    #ffffff;
      --ink:        #2d3142;
      --ink-rgb:    45,49,66;
      --muted:      #4f5d75;
      --muted-rgb:  79,93,117;
      --soft:       #7a8399;
      --accent:     #eb6c36;
      --accent-rgb: 235,108,54;
      --link:       #2e5aa8;
      --color-paper:  var(--paper);
      --color-ink:    var(--ink);
      --color-muted:  var(--muted);
      --color-accent: var(--accent);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-title:    'Inter', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    :root:has(#theme:checked),
    :root:has(#dark:target) {
      --paper:      #2d3142;
      --paper-2:    #393e53;
      --ink:        #f5f5f5;
      --ink-rgb:    245,245,245;
      --muted:      #bfc0c0;
      --muted-rgb:  191,192,192;
      --soft:       #8e98ac;
      --accent:     #f08a59;
      --accent-rgb: 240,138,89;
      --link:       #6a95d8;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 1.25rem 1.5rem 1rem;
    }

    .frame { width: 100%; max-width: 1080px; position: relative; }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .frame:hover .theme-toggle, .theme-toggle:focus-within { opacity: 1; }
    @media print { .theme-toggle { display: none; } }
    .theme-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .theme-toggle .track {
      width: 28px;
      height: 16px;
      border-radius: 8px;
      border: 1px solid rgba(var(--ink-rgb), 0.30);
      background: rgba(var(--ink-rgb), 0.05);
      position: relative;
      transition: background 120ms ease;
    }
    .theme-toggle .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-muted);
      transition: transform 120ms ease;
    }
    .theme-toggle input:checked + .track { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); }
    .theme-toggle input:checked + .track::after { transform: translateX(12px); background: var(--accent); }
    .theme-toggle input:focus-visible + .track { outline: 2px solid var(--link); outline-offset: 2px; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    .eyebrow-url { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--link); }
    .eyebrow-url::before { content: "/"; color: var(--soft); margin: 0 0.6em 0 0.4em; }

    h1 {
      font-family: var(--font-title);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-family: var(--font-title);
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    svg { width: 100%; min-width: 872px; display: block; }
  </style>
</head>

    <h1>Gitless GitOps with Flux Operator</h1>
    <p class="subtitle">From a Git push to a signed artifact deployed by ResourceSets</p>

      <desc id="flux-operator-gitless-desc">Architecture diagram of the Gitless GitOps flow. A developer pushes to the Git repository, which triggers the CI pipeline to publish and sign an OCI artifact in the container registry with flux push and cosign. Inside the Kubernetes cluster, a ResourceSetInputProvider of type OCIArtifactTag scans the registry for new tags and exports them as inputs, a ResourceSet renders its templates for the new tag and digest, and the Flux Operator reconciles it by generating an OCIRepository together with a HelmRelease or Kustomization. The Flux controllers pull and verify the signed artifact from the registry and apply the application.</desc>
